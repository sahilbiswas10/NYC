<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - NYC</title>
    <script>window.tailwind = window.tailwind || {}; window.tailwind.config = { darkMode: 'class' };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-[var(--bg-color)] brutal-border border-x-0 border-t-0 px-6 py-4 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-4 text-2xl font-black uppercase tracking-tighter hover:opacity-80 transition-opacity text-[var(--foreground)]">
            <svg width="35" height="35" viewBox="0 0 100 100" class="animate-[spin_10s_linear_infinite] overflow-visible">
                <rect x="0" y="0" width="100" height="100" fill="var(--primary)" stroke="var(--foreground)" stroke-width="8"/>
                <text x="50" y="65" font-family="monospace" font-size="40" font-weight="900" text-anchor="middle" fill="var(--foreground)">NYC</text>
            </svg>
            <span>NOT YOUR COLLEGE</span>
        </a>
        <div class="flex items-center gap-6 font-bold" id="nav-links"></div>
    </nav>

    <main class="flex-grow w-full max-w-7xl mx-auto px-6 py-12 relative z-10">
        <div class="flex items-end justify-between mb-16">
            <h1 class="text-4xl md:text-5xl font-black uppercase tracking-tighter text-[var(--foreground)] text-shadow-brutal">ALL COURSES</h1>
        </div>

        <div class="course-discovery-toolbar mb-10">
            <div class="course-search-wrap">
                <label for="course-search" class="block text-sm font-black uppercase tracking-widest mb-2">Find a course</label>
                <div class="course-search-control">
                    <i data-lucide="search" class="w-5 h-5 shrink-0" aria-hidden="true"></i>
                    <input id="course-search" type="search" autocomplete="off" placeholder="Search titles, topics, skills, or instructors" class="min-w-0 flex-1 bg-transparent text-[var(--foreground)] font-bold focus:outline-none" aria-describedby="course-search-status">
                    <kbd class="hidden sm:inline-block">⌘ / CTRL + K</kbd>
                </div>
                <p id="course-search-status" class="mt-3 text-sm font-bold" aria-live="polite">Loading courses…</p>
            </div>
            <button id="open-course-filters" type="button" class="course-filter-trigger" aria-haspopup="dialog" aria-controls="course-filter-dialog">
                <i data-lucide="sliders-horizontal" class="w-5 h-5" aria-hidden="true"></i>
                <span>Filters</span>
                <span id="active-filter-count" class="course-filter-count" aria-label="Active filters">0</span>
            </button>
        </div>

        <dialog id="course-filter-dialog" class="course-filter-dialog" aria-labelledby="course-filter-heading">
            <div class="course-filter-dialog-panel">
                <header class="course-filter-dialog-header">
                    <div>
                        <p class="course-reviews-kicker">Course discovery</p>
                        <h2 id="course-filter-heading" class="text-2xl md:text-3xl font-black uppercase">Filter courses</h2>
                    </div>
                    <button id="close-course-filters" type="button" class="course-filter-close" aria-label="Close filters">×</button>
                </header>
                <section class="course-discovery-filters" aria-label="Filter and sort courses">
                    <label class="course-filter-field" for="filter-price">
                        <span>Price</span>
                        <select id="filter-price" class="course-filter-select">
                            <option value="any">Any price</option>
                            <option value="free">Free</option>
                            <option value="paid">Paid</option>
                        </select>
                    </label>
                    <label class="course-filter-field" for="filter-max-price">
                        <span>Max price · INR</span>
                        <input id="filter-max-price" class="course-filter-select" type="number" min="0" step="100" inputmode="decimal" placeholder="No limit">
                    </label>
                    <label class="course-filter-field" for="filter-level">
                        <span>Level</span>
                        <select id="filter-level" class="course-filter-select"><option value="any">All levels</option></select>
                    </label>
                    <label class="course-filter-field" for="filter-instructor">
                        <span>Instructor</span>
                        <select id="filter-instructor" class="course-filter-select"><option value="any">All instructors</option></select>
                    </label>
                    <label class="course-filter-field" for="filter-duration">
                        <span>Duration</span>
                        <select id="filter-duration" class="course-filter-select">
                            <option value="any">Any duration</option>
                            <option value="short">Up to 2 hours</option>
                            <option value="medium">2–10 hours</option>
                            <option value="long">Over 10 hours</option>
                            <option value="unknown">Not listed</option>
                        </select>
                    </label>
                    <label class="course-filter-field" for="sort-courses">
                        <span>Sort by</span>
                        <select id="sort-courses" class="course-filter-select">
                            <option value="newest">Newest</option>
                            <option value="popular">Most popular</option>
                        </select>
                    </label>
                </section>
                <footer class="course-filter-dialog-actions">
                    <button id="reset-course-filters" type="button" class="course-filter-reset">Clear filters</button>
                    <button id="apply-course-filters" type="button" class="course-filter-apply">Show courses</button>
                </footer>
            </div>
        </dialog>
        
        <div id="courses-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <div class="p-8 text-2xl font-black uppercase text-[var(--foreground)]">Loading catalog...</div>
        </div>
    </main>

    <!-- Global Footer -->
    <footer class="w-full bg-[var(--bg-color)] brutal-border border-x-0 border-b-0 py-8 px-6 mt-auto z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="text-xl font-black uppercase tracking-tighter text-[var(--foreground)]">
                © 2026 NOT YOUR COLLEGE
            </div>
            <div class="flex items-center gap-6">
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram" class="social-link p-3 brutal-border bg-[var(--bg-color)] text-[var(--foreground)] hover:bg-[var(--primary)] hover:-translate-y-1 hover:-translate-x-1 transition-transform brutal-shadow">
                    <svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="18" cy="6" r=".8" fill="currentColor" stroke="none"></circle></svg>
                </a>
                <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube" class="social-link p-3 brutal-border bg-[var(--bg-color)] text-[var(--foreground)] hover:bg-[var(--accent)] hover:-translate-y-1 hover:-translate-x-1 transition-transform brutal-shadow">
                    <svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12s0-3.2-.4-4.7a2.8 2.8 0 0 0-2-2C17.9 4.8 12 4.8 12 4.8s-5.9 0-7.6.5a2.8 2.8 0 0 0-2 2C2 8.8 2 12 2 12s0 3.2.4 4.7a2.8 2.8 0 0 0 2 2c1.7.5 7.6.5 7.6.5s5.9 0 7.6-.5a2.8 2.8 0 0 0 2-2C22 15.2 22 12 22 12Z"></path><path d="m10 15 5-3-5-3z" fill="currentColor" stroke="none"></path></svg>
                </a>
            </div>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            const escapeHtml = (value = '') => String(value).replace(/[&<>"']/g, (char) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[char]));
            const grid = document.getElementById('courses-grid');
            const search = document.getElementById('course-search');
            const status = document.getElementById('course-search-status');
            const priceFilter = document.getElementById('filter-price');
            const maxPriceFilter = document.getElementById('filter-max-price');
            const levelFilter = document.getElementById('filter-level');
            const instructorFilter = document.getElementById('filter-instructor');
            const durationFilter = document.getElementById('filter-duration');
            const sortFilter = document.getElementById('sort-courses');
            const filterDialog = document.getElementById('course-filter-dialog');
            const filterCount = document.getElementById('active-filter-count');
            let courses = [];
            const colors = ['var(--primary)', 'var(--accent)', '#38bdf8'];
            const courseInstructor = (course) => course.instructorProfile?.name || course.instructor?.name || '';
            const addOptions = (select, values, label) => {
                const unique = [...new Map(values.filter(Boolean).map((value) => [value.toLocaleLowerCase(), value])).values()].sort((a, b) => a.localeCompare(b));
                select.innerHTML = `<option value="any">${label}</option>${unique.map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join('')}`;
            };
            const formatDuration = (seconds) => {
                const hours = seconds / 3600;
                if (hours < 1) return `${Math.max(1, Math.round(seconds / 60))} min`;
                return `${Number.isInteger(hours) ? hours : hours.toFixed(1)} hr${hours === 1 ? '' : 's'}`;
            };

            const renderCourses = () => {
                const query = search.value.trim().toLocaleLowerCase();
                const maxPrice = maxPriceFilter.value === '' ? null : Number(maxPriceFilter.value);
                let matches = courses.filter((course) => [
                    course.title, course.shortDescription, course.description, course.category,
                    course.level, ...(course.objectives || []), courseInstructor(course)
                ].filter(Boolean).join(' ').toLocaleLowerCase().includes(query)
                    && (priceFilter.value === 'any' || (priceFilter.value === 'free' ? !(Number(course.price) > 0) : Number(course.price) > 0))
                    && (maxPrice === null || (Number.isFinite(maxPrice) && Number(course.price || 0) <= maxPrice))
                    && (levelFilter.value === 'any' || String(course.level || '').toLocaleLowerCase() === levelFilter.value.toLocaleLowerCase())
                    && (instructorFilter.value === 'any' || courseInstructor(course).toLocaleLowerCase() === instructorFilter.value.toLocaleLowerCase())
                    && (durationFilter.value === 'any'
                        || (durationFilter.value === 'unknown' && !(Number(course.durationSeconds) > 0))
                        || (durationFilter.value === 'short' && Number(course.durationSeconds) > 0 && Number(course.durationSeconds) <= 7200)
                        || (durationFilter.value === 'medium' && Number(course.durationSeconds) > 7200 && Number(course.durationSeconds) <= 36000)
                        || (durationFilter.value === 'long' && Number(course.durationSeconds) > 36000)));
                matches = [...matches];
                if (sortFilter.value === 'popular') {
                    matches.sort((a, b) => Number(b.enrollmentCount || 0) - Number(a.enrollmentCount || 0)
                        || Number(b.averageRating || 0) - Number(a.averageRating || 0));
                } else {
                    matches.sort((a, b) => new Date(b.publishedAt || b.createdAt || 0) - new Date(a.publishedAt || a.createdAt || 0));
                }
                const activeFilters = [
                    priceFilter.value !== 'any', maxPrice !== null, levelFilter.value !== 'any',
                    instructorFilter.value !== 'any', durationFilter.value !== 'any', sortFilter.value !== 'newest'
                ].filter(Boolean).length;
                filterCount.textContent = String(activeFilters);
                filterCount.setAttribute('aria-label', `${activeFilters} active ${activeFilters === 1 ? 'filter' : 'filters'}`);
                status.textContent = `${matches.length} of ${courses.length} ${courses.length === 1 ? 'course' : 'courses'} shown${query ? ` for “${search.value.trim()}”` : ''}.`;
                if (!matches.length) {
                    grid.innerHTML = `<div class="col-span-full p-8 bg-[var(--bg-color)] brutal-border brutal-shadow text-xl font-black">${courses.length ? 'No courses match these filters. Try changing or clearing them.' : 'No courses published yet.'}</div>`;
                    return;
                }
                grid.innerHTML = matches.map((course) => {
                    const index = courses.indexOf(course);
                    const color = colors[index % colors.length];
                    const courseImage = course.thumbnailUrl
                        ? `<img src="${escapeHtml(course.thumbnailUrl)}" alt="${escapeHtml(course.title)} course image" loading="lazy" class="absolute inset-0 w-full h-full object-contain p-4 group-hover:scale-105 transition-transform duration-500">`
                        : `<svg viewBox="0 0 100 100" class="w-32 h-32 opacity-80 group-hover:scale-110 transition-transform"><rect x="20" y="20" width="60" height="60" fill="none" stroke="var(--foreground)" stroke-width="8" transform="rotate(${index * 15} 50 50)"/></svg>`;
                    const rating = Number(course.averageRating) || 0;
                    const reviewLabel = course.reviewCount ? `${rating.toFixed(1)} ★ · ${course.reviewCount} ${course.reviewCount === 1 ? 'review' : 'reviews'}` : 'Not rated yet';
                    const priceLabel = Number(course.price) > 0 ? new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(course.price) : 'Free';
                    const details = [course.level, course.durationSeconds > 0 ? formatDuration(course.durationSeconds) : '', `${Number(course.enrollmentCount) || 0} enrolled`].filter(Boolean);
                    return `
                        <div class="course-card bg-[var(--bg-color)] brutal-border brutal-shadow group transition-all hover:-translate-y-2 hover:-translate-x-2 hover:shadow-[12px_12px_0px_0px_${color}] flex flex-col h-full">
                            <div class="course-card-image brutal-border border-t-0 border-x-0 relative overflow-hidden flex items-center justify-center" style="background-color: ${color}">${courseImage}</div>
                            <div class="p-6 flex flex-col flex-grow">
                                <div class="flex flex-wrap items-center justify-between gap-2 mb-3 text-sm font-black uppercase"><span class="text-[var(--accent)]">${escapeHtml(priceLabel)}</span><span aria-label="${escapeHtml(reviewLabel)}">${escapeHtml(reviewLabel)}</span></div>
                                <h3 class="course-card-title text-2xl md:text-3xl font-black uppercase mb-3 tracking-tight text-[var(--foreground)]">${escapeHtml(course.title)}</h3>
                                <p class="course-card-description text-base font-bold mb-5 text-gray-600 dark:text-gray-400">${escapeHtml(course.shortDescription || course.description || '')}</p>
                                <p class="course-card-meta mb-5">${details.map(escapeHtml).join(' <span aria-hidden="true">·</span> ') || 'Explore the course details'}</p>
                                <a href="course.html?course=${encodeURIComponent(course._id)}" class="w-full text-center text-black brutal-border py-3 font-black uppercase text-xl brutal-shadow hover:bg-black hover:text-white transition-colors block mt-auto" style="background-color: ${color}">VIEW DETAILS</a>
                            </div>
                        </div>`;
                }).join('');
                if (window.lucide) lucide.createIcons();
            };

            try {
                const res = await window.api.courses.getAll();
                courses = res.data;
                addOptions(levelFilter, courses.map((course) => course.level), 'All levels');
                addOptions(instructorFilter, courses.map(courseInstructor), 'All instructors');
                search.addEventListener('input', renderCourses);
                [priceFilter, levelFilter, instructorFilter, durationFilter, sortFilter].forEach((control) => control.addEventListener('change', renderCourses));
                maxPriceFilter.addEventListener('input', renderCourses);
                document.getElementById('open-course-filters').addEventListener('click', () => filterDialog.showModal());
                document.getElementById('close-course-filters').addEventListener('click', () => filterDialog.close());
                document.getElementById('apply-course-filters').addEventListener('click', () => filterDialog.close());
                filterDialog.addEventListener('click', (event) => {
                    if (event.target === filterDialog) filterDialog.close();
                });
                document.getElementById('reset-course-filters').addEventListener('click', () => {
                    search.value = '';
                    priceFilter.value = 'any';
                    maxPriceFilter.value = '';
                    levelFilter.value = 'any';
                    instructorFilter.value = 'any';
                    durationFilter.value = 'any';
                    sortFilter.value = 'newest';
                    renderCourses();
                });
                document.addEventListener('keydown', (event) => {
                    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); search.focus(); }
                });
                renderCourses();
                if (window.lucide) lucide.createIcons();
            } catch(e) {
                console.error(e);
                status.textContent = e.message || 'Unable to load courses.';
                grid.innerHTML = '<div class="col-span-full p-8 bg-red-500 text-white brutal-border text-xl font-black">Unable to load courses. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
