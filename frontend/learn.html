<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Center - NYC</title>
    <script>window.tailwind = window.tailwind || {}; window.tailwind.config = { darkMode: 'class' };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body class="bg-[var(--bg-color)] text-[var(--foreground)] h-screen flex flex-col md:flex-row overflow-hidden">
    
    <!-- Video Section -->
    <div class="flex-1 flex flex-col h-full overflow-y-auto">
        <div class="p-6 border-b-8 border-[var(--foreground)] flex justify-between items-center bg-[var(--primary)] sticky top-0 z-10 brutal-shadow">
            <h1 id="lesson-title" class="text-3xl font-black uppercase tracking-tighter">Loading...</h1>
            <a href="student/dashboard.html" id="back-dashboard-btn" class="bg-[var(--bg-color)] text-[var(--foreground)] brutal-border px-4 py-2 font-black uppercase hover:-translate-y-1 hover:-translate-x-1 hover:shadow-[4px_4px_0px_0px_var(--foreground)] transition-all flex items-center gap-2">
                <i data-lucide="arrow-left" class="w-5 h-5"></i> Dashboard
            </a>
        </div>
        
        <div class="p-6 md:p-12">
            <div id="player-frame" class="bg-[var(--bg-color)] brutal-border brutal-shadow p-2 w-full max-w-5xl mx-auto mb-8">
                <div class="bg-black aspect-video relative flex items-center justify-center">
                    <video id="course-video" class="w-full h-full object-contain" controls controlsList="nodownload"></video>
                </div>
            </div>
            <div id="text-lesson-panel" class="hidden max-w-5xl mx-auto mb-8 bg-[var(--bg-color)] brutal-border brutal-shadow p-8">
                <div id="text-lesson-content" class="text-lg font-bold whitespace-pre-wrap leading-relaxed"></div>
                <button id="complete-text-lesson" class="mt-8 bg-[var(--primary)] text-black brutal-border px-6 py-3 font-black uppercase brutal-shadow">Mark lesson complete</button>
                <p id="text-lesson-status" class="mt-4 font-bold" aria-live="polite"></p>
            </div>
            <p id="player-error" class="hidden max-w-5xl mx-auto mb-8 bg-red-500 text-white brutal-border p-4 font-bold" aria-live="polite"></p>
            <div class="max-w-5xl mx-auto">
                <p id="lesson-desc" class="course-copy text-base md:text-lg font-bold p-6 bg-[var(--bg-color)] brutal-border brutal-shadow">Loading description...</p>
            </div>
        </div>
    </div>

    <!-- Curriculum Sidebar -->
    <div class="w-full md:w-96 bg-[var(--bg-color)] border-l-8 border-[var(--foreground)] h-full overflow-y-auto flex flex-col z-20">
        <div class="p-6 border-b-8 border-[var(--foreground)] bg-[var(--accent)] sticky top-0">
            <h2 class="text-2xl font-black uppercase tracking-tighter text-white">Course Content</h2>
        </div>
        <div id="curriculum-container" class="p-6 space-y-6 bg-white dark:bg-[#111111]">
            <div class="animate-pulse bg-gray-300 dark:bg-gray-700 h-12 brutal-border"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/streaming.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/player.js"></script>
    <script>lucide.createIcons();</script>
<script src="js/navbar.js"></script>
</body>
</html>
