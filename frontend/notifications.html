<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - NYC</title>
    <script>window.tailwind = window.tailwind || {}; window.tailwind.config = { darkMode: 'class' };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/aurora.css">
    <script src="js/theme.js"></script>
    <script src="js/page-transitions.js"></script>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-[var(--bg-color)] brutal-border border-x-0 border-t-0 px-6 py-4 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-4 text-2xl font-black uppercase tracking-tighter hover:opacity-80 transition-opacity text-[var(--foreground)]">
            <svg width="35" height="35" viewBox="0 0 100 100" class="animate-[spin_10s_linear_infinite] overflow-visible">
                <rect x="0" y="0" width="100" height="100" fill="var(--primary)" stroke="var(--foreground)" stroke-width="8"/>
                <text x="50" y="65" font-family="monospace" font-size="40" font-weight="900" text-anchor="middle" fill="var(--foreground)">NYC</text>
            </svg>
            <span>NOT YOUR COLLEGE</span>
        </a>
        <div class="flex items-center gap-6 font-bold" id="nav-links"></div>
    </nav>

    <main class="feature-page">
        <h1 class="text-3xl font-black uppercase mb-4">Notifications</h1>
        <p class="course-copy mb-6">Course announcements, discussion replies, and your quiz results.</p>
        <div class="feature-actions"><button id="notifications-read-all" type="button" class="feature-button">Mark all as read</button><button id="notifications-refresh" type="button" class="feature-button">Refresh</button></div>
        <p id="notifications-status" role="status" aria-live="polite">Loading notifications…</p>
        <div id="notification-list" class="space-y-4"></div>
        <div class="feature-actions"><button id="notifications-previous" type="button" class="feature-button">Previous</button><span id="notifications-page"></span><button id="notifications-next" type="button" class="feature-button">Next</button></div>
    </main>
    <script src="js/api.js"></script><script src="js/notifications.js"></script><script src="js/navbar.js"></script>
</body></html>
