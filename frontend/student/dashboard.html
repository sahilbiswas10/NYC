<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - NYC</title>
    <script>window.tailwind = window.tailwind || {}; window.tailwind.config = { darkMode: 'class' };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme.js"></script>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-[var(--bg-color)] brutal-border border-x-0 border-t-0 px-6 py-4 flex items-center justify-between">
        <a href="../index.html" class="flex items-center gap-4 text-2xl font-black uppercase tracking-tighter hover:opacity-80 transition-opacity text-[var(--foreground)]">
            <svg width="35" height="35" viewBox="0 0 100 100" class="animate-[spin_10s_linear_infinite] overflow-visible">
                <rect x="0" y="0" width="100" height="100" fill="var(--primary)" stroke="var(--foreground)" stroke-width="8"/>
                <text x="50" y="65" font-family="monospace" font-size="40" font-weight="900" text-anchor="middle" fill="var(--foreground)">NYC</text>
            </svg>
            <span>NOT YOUR COLLEGE</span>
        </a>
        <div class="flex items-center gap-6 font-bold" id="nav-links">
            <button id="theme-toggle" class="p-2 brutal-border bg-[var(--bg-color)] text-[var(--foreground)] hover:bg-[var(--primary)] transition-colors shadow-[2px_2px_0px_0px_var(--foreground)]"><i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i><i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i></button>
            
            <a href="../courses.html" class="uppercase hover:text-[var(--primary)] transition-colors">Courses</a>
            <a href="../profile.html" class="flex items-center gap-2 uppercase hover:text-[var(--primary)] transition-colors"><i data-lucide="user" class="w-4 h-4"></i> Profile</a>
            
        </div>
    </nav>

    <main class="flex-grow w-full max-w-7xl mx-auto px-6 py-12 relative z-10">
        <div class="flex items-end justify-between mb-12">
            <h1 class="text-5xl md:text-6xl font-black uppercase tracking-tighter text-[var(--foreground)] text-shadow-brutal">MY DASHBOARD</h1>
        </div>
        
        
        <h2 class="text-3xl font-black uppercase mb-6 tracking-tight text-[var(--foreground)] border-l-8 border-[var(--primary)] pl-4">Continue Watching</h2>

        <div id="continue-watching" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-16">
            <div class="p-6 bg-[var(--bg-color)] brutal-border brutal-shadow font-bold text-[var(--foreground)]">Loading...</div>
        </div>
        
        <h2 class="text-3xl font-black uppercase mb-6 tracking-tight text-[var(--foreground)] border-l-8 border-[var(--accent)] pl-4">My Enrolled Courses</h2>
        <div id="enrolled-courses" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="p-6 bg-[var(--bg-color)] brutal-border brutal-shadow font-bold text-[var(--foreground)]">Loading...</div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/dashboard.js"></script>
    <script>
        lucide.createIcons();
        
    </script>
<script src="../js/navbar.js"></script>
</body>
</html>
